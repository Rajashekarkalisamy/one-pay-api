version: '3.8'

services:
  traefik:
    image: traefik:v2.9
    command:
      - --api.insecure=true
      - --providers.docker
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - web
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  mysql:
    image: rajasekar9698/one-pay-mysql:1.0.0
    volumes:
      - ./sql-scripts:/docker-entrypoint-initdb.d
      - /docker/database/mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "12345"
    networks:
      - web

  adminer:
    image: rajasekar9698/one-pay-adminer:1.0.0
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`adminer.onepay.com`)"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"
    networks:
      - web

  mongo:
    image: rajasekar9698/one-pay-mongo:1.0.0
    volumes:
      - /docker/database/mongo:/data/db
    ports:
      - 27018:27017
    networks:
      - web

  mongo-express:
    image: rajasekar9698/one-pay-mongo-express:1.0.0
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mongo-express.rule=Host(`mongo-express.onepay.com`)"
      - "traefik.http.services.mongo-express.loadbalancer.server.port=8081"
    networks:
      - web

  app:
    image: rajasekar9698/one-pay-api:1.0.0
    working_dir: /usr/src/app
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - PORT=8080
      - MYSQL_HOST=mysql
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=12345
      - MYSQL_DATABASE=onepay
      - MONGO_URL=mongodb://mongo:27017/onepay
      - JWT_SECRET_KEY=bmxpbmUgSldUIEJ1aWxkZXIiLCJpYXQiOjE2OTczMDgyNzgsImV4cCI6MTcyODg0NDI3OCwiYXVkIjoid3d3LmV
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`api.onepay.com`)"
      - "traefik.http.services.app.loadbalancer.server.port=8080"
    networks:
      - web

  admin-app:
    image: rajasekar9698/onepay-admin-app:1.0.0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-app.rule=Host(`admin.onepay.com`)"
      - "traefik.http.services.admin-app.loadbalancer.server.port=80"
    networks:
      - web

networks:
  web:
    driver: overlay
